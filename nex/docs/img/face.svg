<text x="622" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#76b900" text-anchor="start" opacity="1.0">NVIDIA NIM · builder</text>
<text x="1140" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">12 / 40 this minute</text>
<rect x="604" y="198" width="548" height="38" rx="8" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="604" y="198" width="5" height="38" rx="3" fill="#10a37f" stroke="#10a37f" stroke-width="0" opacity="1.0"/>
<text x="622" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10a37f" text-anchor="start" opacity="1.0">GPT-5.1 · planner</text>
<text x="1140" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">used sparingly</text>
<rect x="604" y="244" width="548" height="38" rx="8" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="604" y="244" width="5" height="38" rx="3" fill="#f0a000" stroke="#f0a000" stroke-width="0" opacity="1.0"/>
<text x="622" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f0a000" text-anchor="start" opacity="1.0">gpt-oss:20b · local</text>
<text x="1140" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">always available</text>
<rect x="604" y="290" width="548" height="38" rx="8" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="604" y="290" width="5" height="38" rx="3" fill="#e5484d" stroke="#e5484d" stroke-width="0" opacity="1.0"/>
<text x="622" y="314" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e5484d" text-anchor="start" opacity="1.0">NIM rate-limited</text>
<text x="1140" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">back in ~38 s - local builds meanwhile</text>
<rect x="604" y="336" width="548" height="38" rx="8" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="604" y="336" width="5" height="38" rx="3" fill="#4c8dff" stroke="#4c8dff" stroke-width="0" opacity="1.0"/>
<text x="622" y="360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c8dff" text-anchor="start" opacity="1.0">pacing (headroom)</text>
<text x="1140" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">saving quota: 31 of 40 used, soft cap 30</text>
<rect x="604" y="382" width="548" height="38" rx="8" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="604" y="382" width="5" height="38" rx="3" fill="#e5484d" stroke="#e5484d" stroke-width="0" opacity="1.0"/>
<text x="622" y="406" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e5484d" text-anchor="start" opacity="1.0">key warning</text>
<text x="1140" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">rejected / bound to another host</text>
<text x="48" y="462" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">Everything the agent does to your game goes through MCP tools. It never gets a shell, a filesystem or the PC.</text>
</svg>
