<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="NEX: two white eyes on black, with the provider chip">
<title>NEX: two white eyes on black, with the provider chip</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<text x="48" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1.0">NEX</text>
<text x="48" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">a local assistant that builds games through MCP — and shows you which model is doing it</text>
