<rect x="325" y="108" width="4" height="116" rx="2" fill="#a06bff" stroke="#a06bff" stroke-width="0" opacity="1.0"/>
<text x="339" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8edf5" text-anchor="start" opacity="1.0">criteria</text>
<text x="339" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">pass/fail per system</text>
<text x="339" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">(max 12 per system)</text>
