<rect width="100%" height="100%" fill="#0b0d10"/>
<text x="40" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8edf5" text-anchor="start" opacity="1.0">The 40 RPM budget — calmly not using everything</text>
<text x="40" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">Free NVIDIA NIM keys allow ~40 requests/minute with no usage API. Nex counts them itself and leaves headroom, so the next minute always has budget.</text>
