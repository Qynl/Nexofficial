<text x="74" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">requests in the current 60-second window</text>
<text x="1126" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">40 = the published free-tier budget</text>
<text x="74" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#76b900" text-anchor="start" opacity="1.0">1-22 normal build traffic</text>
<text x="540" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#f0a000" text-anchor="start" opacity="1.0">23-30 deliberate pause zone</text>
<text x="1126" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#93a1b8" text-anchor="end" opacity="1.0">31-40 reserve</text>
<text x="60" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#f0a000" text-anchor="start" opacity="1.0">reserve 25 %   soft cap = round(40 x 0.75) = 30</text>
<text x="60" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">min_interval_s = 1 s   max_chill_s = 8 s   NEX_NIM_RPM overrides the budget</text>
<rect x="60" y="320" width="1080" height="52" rx="9" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="60" y="320" width="5" height="52" rx="3" fill="#76b900" stroke="#76b900" stroke-width="0" opacity="1.0"/>
<text x="80" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#76b900" text-anchor="start" opacity="1.0">below the soft cap</text>
<text x="520" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e8edf5" text-anchor="start" opacity="1.0">the call goes out normally</text>
<rect x="60" y="382" width="1080" height="52" rx="9" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="60" y="382" width="5" height="52" rx="3" fill="#4c8dff" stroke="#4c8dff" stroke-width="0" opacity="1.0"/>
<text x="80" y="414" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c8dff" text-anchor="start" opacity="1.0">inside the reserve, a fallback exists</text>
<text x="520" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e8edf5" text-anchor="start" opacity="1.0">the request routes around it (paced_skips++) and the fallback serves</text>
<rect x="60" y="444" width="1080" height="52" rx="9" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="60" y="444" width="5" height="52" rx="3" fill="#f0a000" stroke="#f0a000" stroke-width="0" opacity="1.0"/>
<text x="80" y="476" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#f0a000" text-anchor="start" opacity="1.0">inside the reserve, no fallback</text>
<text x="520" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e8edf5" text-anchor="start" opacity="1.0">bounded chill (&lt;= max_chill_s), then the call goes out</text>
<rect x="60" y="506" width="1080" height="52" rx="9" fill="#141821" stroke="#2b3446" stroke-width="1.2" opacity="1.0"/>
<rect x="60" y="506" width="5" height="52" rx="3" fill="#e5484d" stroke="#e5484d" stroke-width="0" opacity="1.0"/>
<text x="80" y="538" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e5484d" text-anchor="start" opacity="1.0">window completely full</text>
<text x="520" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e8edf5" text-anchor="start" opacity="1.0">chill if a slot is near, else mark rate_limited and fail over</text>
<text x="60" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#93a1b8" text-anchor="start" opacity="1.0">Every decision is visible: the chip shows the countdown and the headroom, the log shows provider.paced / provider.trouble / provider.recovered.</text>
</svg>
